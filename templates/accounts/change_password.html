{% extends 'base.html' %}

{% block content %}

<section class="section-conten padding-y bg">
    {% include 'includes/alerts.html' %}

    <div class="container">
        <div class="row">
            {% include 'includes/dashboard_sidebar.html' %}
            <main class="col-md-9">
                <article class="card">
                    <header class="card-header">
                        <strong class="d-inline-block mr-3"> Change Your Password</strong>

                    </header>
                    <div class="card-body">
                       

                        </div>

                        <div class="col-md-12">
                            <form method="POST" action="{% url 'change_password' %}">
                                {% csrf_token %}
                                <div class="form-group">
                                    <label for="address_line_1">Current Password</label>
                                    <input type="password" class="form-control" placeholder="Current Password" name="current_password" required>
                                </div>
                                <div class="form-group">
                                    <label for="address_line_2">Create new Password</label>
                                    <input type="password" class="form-control" placeholder="Create new Password" name="new_password" required>
                                </div>
                                 <div class="form-group">
                                    <label for="address_line_2">Confirm new Password</label>
                                    <input type="password" class="form-control" placeholder="Confirm new Password" name="confirm_password" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </form>
                        </div> <!-- row.// -->
                    </div> <!-- card-body .// -->

                </article> <!-- order-group.// -->
            </main>
        </div> <!-- row.// -->
    </div>


</section>

{% endblock %}
