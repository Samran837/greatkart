{% extends 'base.html' %}
{% load static %}

{% block content %}



<section class="section-content padding-y bg">
<div class="container">

<!-- ============================ COMPONENT 1 ================================= -->

<div class="row">
	<aside class="col-lg-6">
<div class="card">
    <div class="card-body">
        <h4 class="card-title mb-4"> Billing Address</h4>
        <form action="" method="POST">
			{% csrf_token %}
            <div class="form-row">
                 <div class="col"> 
					<label class="form-label">First Name</label>
					<input type="text" class="form-control" placeholder="First name" required>
				 </div>
				  <div class="col"> 
					<label class="form-label">Last Name</label>
					<input type="text" class="form-control" placeholder="Last name" required>
				 </div>
            </div>
			<div class="form-row">
                 <div class="col"> 
					<label class="form-label">Email</label>
					<input type="email" class="form-control" placeholder="Email" required>
				 </div>
				  <div class="col"> 
					<label class="form-label">Phone Number</label>
					<input type="text" class="form-control" placeholder="Phone number" required>
				 </div>
            </div>
			<div class="form-row">
                 <div class="col"> 
					<label class="form-label">Address Line 1</label>
					<input type="text" class="form-control" placeholder="Address line 1" required>
				 </div>
				  <div class="col"> 
					<label class="form-label">Address Line 2</label>
					<input type="text" class="form-control" placeholder="Address line 2" required>
				 </div>
            </div>
			<div class="form-row">
                 <div class="col"> 
					<label class="form-label">City</label>
					<input type="text" class="form-control" placeholder="City" required>
				 </div>
				  <div class="col"> 
					<label class="form-label">State</label>
					<input type="text" class="form-control" placeholder="State" required>
				 </div>
				  <div class="col"> 
					<label class="form-label">Country</label>
					<input type="text" class="form-control" placeholder="Country" required>
				 </div>
            </div>
			<div class="form-row">
                 <div class="col"> 
					<label class="form-label">Order Notes</label>
					<textarea class="form-control" placeholder="Order notes" required></textarea>
				 </div>

       
    </div>

</div> <!-- card.// -->

	</aside> <!-- col.// -->
	<aside class="col-lg-6">

		<div class="card">
		<div class="card-body">
           
     <table class="table table-borderless table-shopping-cart">
<thead class="text-muted">
<tr class="small text-uppercase">
  <th scope="col">Product</th>
  <th scope="col" width="120">Quantity</th>
  <th scope="col" width="120">Price</th>
 
</tr>
</thead>
<tbody>

{% for cart_item in cart_items %}
<tr>
	<td>
		<figure class="itemside align-items-center">
			<div class="aside"><img src="{{ cart_item.product.image.url }}" class="img-sm"></div>
			<figcaption class="info">
				<a href="{{ cart_item.product.get_product }}" class="title text-dark">{{ cart_item.product.product_name }}</a>
				<p class="text-muted small">
				      {% if cart_item.variations.all %}
				        {% for variation in cart_item.variations.all %}
				          {{ variation.variation_category | lower }} : {{ variation.variation_value | capfirst }} <br>
				        {% endfor %}
				      {% endif %}
				</p>
			</figcaption>
		</figure>
	</td>
	<td> 
		<!-- col.// -->
		 <label for="">{{cart_item.quantity}}</label>


	</td>
	<td> 
		<div class="price-wrap"> 
			<var class="price">${{ cart_item.sub_total}}</var> 
			<small class="text-muted"> ${{ cart_item.product.price}} each </small> 
		</div> <!-- price-wrap .// -->
	</td>

</tr>
{% endfor %}


</tbody>
</table>       
		
			<button type="submit" class="btn btn-success btn-block">Place Order</button>
			<a href="{% url 'store' %}" class="btn btn-light btn-block">Continue Shopping</a>
	 </form>
		</div> <!-- card-body.// -->
		</div> <!-- card.// -->

</aside> <!-- col.// -->


</div> <!-- row.// -->
<!-- ============================ COMPONENT 1 END .// ================================= -->

</div> <!-- container .//  -->
</section>
<!-- ========================= SECTION CONTENT END// ========================= -->


{% endblock %}
